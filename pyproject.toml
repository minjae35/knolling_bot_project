[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knolling-dataset"
version = "0.1.0"
description = "Validated dataset and supervised S0 neural knolling"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "shapely>=2", "pillow"]

[project.optional-dependencies]
test = ["pytest"]
neural = ["torch==2.9.1", "torchvision==0.24.1", "transformers==4.57.3", "scipy==1.16.3", "sentencepiece==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
