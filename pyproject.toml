[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knolling-dataset"
version = "0.1.0"
description = "Validated procedural dataset for neural knolling; no model or training code"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "shapely>=2", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
